name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build
        run: bun run build

      - name: Package
        run: cd dist && zip -r ../extension.zip . -x '*.map'

      - name: Extract Release Notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            started && /^## \[/ { exit }
            $0 ~ "^## \\[" version "\\]" { started = 1 }
            started { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-body.md"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: extension.zip
          body_path: ${{ runner.temp }}/release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
