<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>translate cat</title>
    <link rel="stylesheet" href="lcd.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup lcd-bezel-surface">
      <section
        class="popup__screen lcd-screen-surface"
        aria-label="Translate cat settings"
        data-i18n-aria-label="popupTranslateCatSettings"
      >
        <header class="popup__header">
          <img
            class="popup__logo"
            src="icons/icon.svg"
            alt="translate cat pixel logo"
            data-i18n-alt="pixelLogoAlt"
          />
          <span>TRANSLATE CAT</span>
        </header>

        <section class="popup__settings" aria-label="Settings" data-i18n-aria-label="popupSettings">
          <label class="lcd-row">
            <span class="lcd-row__label" data-i18n="popupProvider">PROVIDER</span>
            <select id="provider-type">
              <button><selectedcontent></selectedcontent></button>
            </select>
          </label>
          <label class="lcd-row" id="provider-api-key-row">
            <span class="lcd-row__label" data-i18n="popupApiKey">API KEY</span>
            <input
              id="provider-api-key"
              type="password"
              autocomplete="off"
              placeholder="ENTER TO CHANGE"
              data-i18n-placeholder="popupEnterToChange"
            />
          </label>
          <div class="popup__auth-row lcd-row" id="codex-auth-row" hidden>
            <span class="lcd-row__label" data-i18n="popupAccount">ACCOUNT</span>
            <button class="lcd-chip" id="codex-sign-in" type="button">
              <span class="codex-chip__labels">
                <span class="codex-chip__label" data-i18n="signIn">Sign in</span>
                <span class="codex-chip__sign-out-label" aria-hidden="true"></span>
              </span>
            </button>
          </div>
          <label class="lcd-row">
            <span class="lcd-row__label" data-i18n="popupModel">MODEL</span>
            <select id="provider-model-preset">
              <button><selectedcontent></selectedcontent></button>
            </select>
          </label>
          <label class="lcd-row" id="custom-model-row" hidden>
            <span class="lcd-row__label" data-i18n="popupCustomModelLabel">CUSTOM MODEL</span>
            <input
              id="provider-model"
              type="text"
              placeholder="MODEL ID"
              data-i18n-placeholder="popupModelId"
            />
          </label>
          <label class="lcd-row popup__toggle">
            <span class="lcd-row__label" data-i18n="popupSelection">SELECTION</span>
            <input id="selection-enabled" type="checkbox" />
            <span class="lcd-chip popup__toggle-chip" aria-hidden="true">
              <span class="popup__toggle-label"></span>
            </span>
          </label>
          <label class="lcd-row">
            <span class="lcd-row__label" data-i18n="popupLanguage">LANGUAGE</span>
            <select id="target-language">
              <button><selectedcontent></selectedcontent></button>
            </select>
          </label>
          <div class="popup__save-row lcd-row">
            <button class="lcd-chip" id="save" type="button" data-i18n="popupSave">Save</button>
            <p id="status" role="status"></p>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
