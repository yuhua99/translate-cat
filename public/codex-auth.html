<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="codexAuthTitle">Sign in with ChatGPT</title>
    <link rel="stylesheet" href="lcd.css" />
    <link rel="stylesheet" href="codex-auth.css" />
  </head>
  <body>
    <main class="auth lcd-bezel-surface">
      <section
        class="auth__screen lcd-screen-surface"
        aria-label="ChatGPT device code sign in"
        data-i18n-aria-label="codexAuthDeviceCodeSignIn"
      >
        <header class="auth__header">
          <img
            class="auth__logo"
            src="icons/icon.svg"
            alt="translate cat pixel logo"
            data-i18n-alt="pixelLogoAlt"
          />
          <h1 data-i18n="codexAuthTitle">Sign in with ChatGPT</h1>
        </header>

        <section id="auth-loading">
          <p>
            <span data-i18n="codexAuthRequestingCode">Requesting code...</span>
            <span class="lcd-cursor" aria-hidden="true">█</span>
          </p>
        </section>

        <section id="auth-code" hidden>
          <p id="user-code" class="user-code"></p>
          <div class="actions">
            <button id="copy-code" class="lcd-bezel-key" type="button" data-i18n="copy">
              Copy
            </button>
            <a
              id="verification-link"
              class="lcd-bezel-key"
              target="_blank"
              rel="noopener"
              data-i18n="codexAuthOpenVerificationPage"
            >
              Open verification page
            </a>
          </div>
          <p class="auth__waiting">
            <span data-i18n="codexAuthEnterCode">
              Enter this code on the verification page. Waiting for approval…
            </span>
            <span class="lcd-cursor" aria-hidden="true">█</span>
          </p>
          <p class="note" data-i18n="codexAuthKeepPageOpen">
            Keep this page open while you sign in.
          </p>
        </section>

        <section id="auth-success" hidden>
          <p class="success lcd-inverted" data-i18n="codexAuthSignedIn">
            Signed in. You can close this tab.
          </p>
        </section>

        <section id="auth-error" hidden>
          <p id="error-message" class="error lcd-inverted"></p>
          <button id="retry" class="lcd-bezel-key" type="button" data-i18n="codexAuthRetry">
            Retry
          </button>
        </section>
      </section>
    </main>
    <script type="module" src="codex-auth.js"></script>
  </body>
</html>
